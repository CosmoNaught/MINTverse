name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Needed only when _freeze/ is stale or absent; a valid freeze replays instead.
      - name: Set up the render environment
        run: uv sync

      - name: Cache the stateMINT weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-statemint-v1.2.2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_PYTHON: .venv/bin/python
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TQDM_DISABLE: "1"
