<!-- Move the page breadcrumb up into the header bar, just after the "MINTverse"
     brand, so the banner reads "MINTverse > <section> > <subsection>". The node is
     relocated (not duplicated); on narrow screens it keeps its d-none class and
     the secondary-nav breadcrumb takes over as before. -->
<script>
(function () {
  function moveBreadcrumb() {
    var brand = document.querySelector("#quarto-header .navbar-brand-container");
    var crumbs = document.querySelector("#title-block-header nav.quarto-title-breadcrumbs");
    if (brand && crumbs && !brand.contains(crumbs)) {
      crumbs.classList.add("mint-navbar-breadcrumbs");
      brand.appendChild(crumbs);
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", moveBreadcrumb);
  } else {
    moveBreadcrumb();
  }
})();
</script>
