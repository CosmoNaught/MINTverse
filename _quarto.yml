jupyter: python3

execute:
  freeze: auto
  eval: true
  echo: true
  warning: false
  error: false

format:
  html:
    theme: [darkly, styles/theme.scss]
    highlight-style: atom-one
    html-math-method: mathjax
    include-in-header: _mathjax-config.html
    include-after-body:
      - _navbar-breadcrumb.html
      - _prevnext-fix.html
    link-external-newwindow: true
    link-external-icon: false
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    code-copy: true
    code-overflow: scroll
    fig-align: left
    grid:
      sidebar-width: 340px
