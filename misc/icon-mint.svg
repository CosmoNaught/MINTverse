<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MINTverse">
  <defs>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="50%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#0b0e13" stroke="url(#mintGrad)" stroke-width="2.5"/>
  <!-- stylised "M" drawn as an upward wave: mint -> bright -> blue -->
  <path d="M16 44 V22 L32 38 L48 22 V44"
        fill="none" stroke="url(#mintGrad)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="38" r="3.2" fill="#00ffcc"/>
</svg>
